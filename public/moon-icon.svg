<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E7FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C7D2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A5B4FC;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="craterGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6B7280;stop-opacity:0.6" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main moon circle -->
  <circle cx="32" cy="32" r="28" fill="url(#moonGradient)" filter="url(#glow)" />
  
  <!-- Large crater -->
  <ellipse cx="24" cy="28" rx="4" ry="3" fill="url(#craterGradient)" />
  
  <!-- Medium crater -->
  <ellipse cx="38" cy="20" rx="2.5" ry="2" fill="url(#craterGradient)" />
  
  <!-- Small craters -->
  <circle cx="28" cy="42" r="1.5" fill="url(#craterGradient)" />
  <circle cx="42" cy="35" r="1" fill="url(#craterGradient)" />
  <circle cx="18" cy="38" r="1" fill="url(#craterGradient)" />
  
  <!-- Subtle highlight -->
  <path d="M 20 18 Q 32 12 44 18 Q 38 22 32 20 Q 26 18 20 18" fill="white" opacity="0.3" />
  
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#moonGradient)" stroke-width="0.5" opacity="0.4" />
</svg>